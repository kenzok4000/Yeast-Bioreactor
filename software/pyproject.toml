[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yeast-bioreactor"
version = "0.1.0"
description = "Digital twin, estimation, MPC, ML and dashboard for a hobby yeast bioreactor"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "casadi>=3.6",
    "plotly>=5.15",
    "dash>=2.14",
    "scikit-learn>=1.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["bioreactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
